# Public edge: TLS / rate limiting / routing.
# Nginx is the only public entry point (80/443). The API, database and the
# internal frontend container are bound to loopback or the Docker network.

# Basic brute-force protection for login/register (per client IP).
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;

server {
    listen 80;
    server_name _;
    client_max_body_size 64M;
    server_tokens off;

    # Health probe used by Docker/uptime checks.
    location = /health {
        proxy_pass http://backend:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Auth endpoints: throttled. Keep the burst generous enough that normal
    # users never notice, but slow down credential stuffing.
    location /api/v1/auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API -> backend
    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Frontend SPA (its nginx handles gzip, caching and the /api fallback).
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

