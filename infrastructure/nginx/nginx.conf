# Public edge: TLS / rate limiting / routing.
# Nginx is the only public entry point (80/443). The API, database and the
# internal frontend container are bound to loopback or the Docker network.

# NOTE: realip.conf sits in this same folder and is auto-loaded by
# /etc/nginx/conf.d/*.conf — do not `include` it here or the directives load
# twice. Fill it in when Cloudflare / an ALB sits in front (see realip.conf).

# Basic brute-force protection for login/register (per client IP).
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;

server {
    listen 80;
    server_name _;
    client_max_body_size 64M;
    server_tokens off;

    # Let's Encrypt HTTP-01 challenge (used by scripts/init-letsencrypt.sh).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # Health probe used by Docker/uptime checks.
    location = /health {
        proxy_pass http://backend:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Auth endpoints: throttled. Keep the burst generous enough that normal
    # users never notice, but slow down credential stuffing.
    location /api/v1/auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API -> backend
    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Frontend SPA (its nginx handles gzip, caching and the /api fallback).
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------
# HTTPS lives in https.conf (not committed — it contains certificate paths).
# Issue certificates, then:
#   cp nginx/https.conf.example nginx/https.conf
#   sed -i 's/your-domain.com/<your-domain>/g' nginx/https.conf
#   docker compose restart nginx
# See scripts/init-letsencrypt.sh and docs/deployment.md.
