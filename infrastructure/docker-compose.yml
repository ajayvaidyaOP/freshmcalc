# FreshmCalc — full stack: PostgreSQL + Spring Boot API + React app + Nginx
#
#   cp .env.example .env && docker compose up --build -d
#
# Why Docker for this project (long-term, subscription-based):
#   • One reproducible stack on any VPS — no JDK/Node/Postgres version drift.
#   • App Store/Play Store builds and the web app share the same API image.
#   • Backups, restarts and horizontal scaling are simple container operations.
#   • Secrets stay in .env on the server, never inside images or Git.

services:
  postgres:
    image: postgres:16-alpine
    container_name: freshmcalc-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-freshmcalc}
      POSTGRES_USER: ${DB_USERNAME:-freshmcalc}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set a strong DB_PASSWORD in infrastructure/.env}"
      # Also read by scripts/backup.sh, restore.sh and verify-backup.sh.
      DB_NAME: ${DB_NAME:-freshmcalc}
      DB_USERNAME: ${DB_USERNAME:-freshmcalc}
      # Faster, deterministic init for a fresh volume
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - freshmcalc_postgres_data:/var/lib/postgresql/data
      # Dumps land on the host (not inside the container) so a recreated
      # container never loses its backups. See docs/deployment.md.
      - ./backups:/backups
      - ./scripts/backup.sh:/backup/backup.sh:ro
      - ./scripts/restore.sh:/backup/restore.sh:ro
      - ./scripts/verify-backup.sh:/backup/verify-backup.sh:ro
    # Loopback only: the database is never reachable from the public internet.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-freshmcalc} -d ${DB_NAME:-freshmcalc}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - freshmcalc

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: freshmcalc-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-freshmcalc}
      DB_USERNAME: ${DB_USERNAME:-freshmcalc}
      DB_PASSWORD: "${DB_PASSWORD:?Set a strong DB_PASSWORD in infrastructure/.env}"
      SERVER_PORT: 8080
      JWT_SECRET: "${JWT_SECRET:?Set a random JWT_SECRET in infrastructure/.env}"
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_TEST_MODE: ${RAZORPAY_TEST_MODE:-false}
      # Browsers call the API through Nginx (same origin). Add the store-app
      # origin only if you ever host the app shell on a different domain.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@freshmcalc.com}
      APP_MAIL_EXPOSE_RESET_LINK: ${APP_MAIL_EXPOSE_RESET_LINK:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-Admin}
    # Direct API access for debugging only; public traffic goes through Nginx.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
    stop_grace_period: 30s
    logging: *logging
    restart: unless-stopped
    networks:
      - freshmcalc

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Vite bakes this in at build time (runtime env would not work).
        VITE_API_BASE: /api/v1
    container_name: freshmcalc-frontend
    # Only for direct container checks; the public entry point is Nginx.
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped
    networks:
      - freshmcalc

  nginx:
    image: nginx:1.27-alpine
    container_name: freshmcalc-nginx
    volumes:
      # Whole edge config folder: nginx.conf, realip.conf and (after you issue
      # certificates) https.conf. *.conf files are auto-loaded; *.example files
      # are ignored by nginx.
      - ./nginx:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging
    restart: unless-stopped
    networks:
      - freshmcalc

  # TLS certificates (Let's Encrypt). Only runs on demand:
  #   docker compose --profile tls run --rm certbot certificates
  certbot:
    image: certbot/certbot:v2.11.0
    # No container_name: `docker compose run` must be free to create throwaway
    # containers for individual certbot commands.
    profiles: ["tls"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  freshmcalc_postgres_data:
    name: freshmcalc_postgres_data

networks:
  freshmcalc:
    driver: bridge
