version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: freshmcalc-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-freshmcalc}
      POSTGRES_USER: ${DB_USERNAME:-freshmcalc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-freshmcalc}
    volumes:
      - freshmcalc_postgres_data:/var/lib/postgresql/data
      - ./scripts/backup.sh:/backup/backup.sh
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-freshmcalc} -d ${DB_NAME:-freshmcalc}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - freshmcalc

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: freshmcalc-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-freshmcalc}
      DB_USERNAME: ${DB_USERNAME:-freshmcalc}
      DB_PASSWORD: ${DB_PASSWORD:-freshmcalc}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-this-must-be-at-least-256-bits-long}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_TEST_MODE: ${RAZORPAY_TEST_MODE:true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - freshmcalc
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: freshmcalc-frontend
    environment:
      VITE_API_BASE: /api
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - freshmcalc
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: freshmcalc-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - freshmcalc
    restart: unless-stopped

volumes:
  freshmcalc_postgres_data:

networks:
  freshmcalc:
    driver: bridge

