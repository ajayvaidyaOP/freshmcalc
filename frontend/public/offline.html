<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a2519" />
    <title>Offline · FreshmCalc</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background:
          radial-gradient(720px 320px at 85% -10%, rgba(95, 185, 136, 0.28), transparent 60%),
          radial-gradient(560px 280px at -10% 110%, rgba(163, 230, 53, 0.1), transparent 55%),
          linear-gradient(160deg, #0d2f1f 0%, #0a2519 55%, #071b12 100%);
        color: #e7f6ec;
      }
      .card {
        width: min(420px, 100%);
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
        border-radius: 28px;
        padding: 36px 26px;
        backdrop-filter: blur(12px);
      }
      .logo {
        width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 20px;
        display: grid; place-items: center;
        background: linear-gradient(135deg, #389d68, #1c5238);
        box-shadow: 0 12px 30px -12px rgba(0, 0, 0, 0.6);
      }
      h1 { font-size: 22px; margin: 0 0 10px; letter-spacing: -0.02em; }
      p { margin: 0 0 22px; font-size: 14px; line-height: 1.6; color: #a9cbbb; }
      button {
        width: 100%; min-height: 48px; border: 0; border-radius: 14px; cursor: pointer;
        background: #bef264; color: #0a2519; font-weight: 800; font-size: 15px;
      }
      button:active { transform: scale(0.98); }
      small { display: block; margin-top: 16px; color: #6f9581; font-size: 11.5px; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#d9f99d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 20h10" /><path d="M12 20v-8" />
          <path d="M12 12C12 8 9 5 5 5c0 4 3 7 7 7Z" fill="#d9f99d" stroke="none" opacity=".9" />
          <path d="M12 12c0-3 2-6 6-7 1 4-1 7-5 8Z" fill="#95d3ae" stroke="none" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        FreshmCalc needs a connection for live Dubai rates and saved cost sheets.
        Reconnect and try again — your unsaved calculation stays on this device.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
      <small>Dubai wholesale rates in AED · India is the sourcing origin</small>
    </main>
  </body>
</html>
