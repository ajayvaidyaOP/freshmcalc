spring:
  application:
    name: freshmcalc-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/freshmcalc}
    username: ${DB_USERNAME:freshmcalc}
    password: ${DB_PASSWORD:freshmcalc}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc.batch_size: 20
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  mail:
    host: ${MAIL_HOST:smtp.local}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls.enable: false

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        health: true
        info: true
  endpoint:
    health:
      show-details: always

api:
  version: v1
  base-path: /api/${api.version}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  test-mode: ${RAZORPAY_TEST_MODE:true}

jwt:
  secret: ${JWT_SECRET:change-me-in-production-this-must-be-at-least-256-bits-long}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

market:
  default-market: Dubai, UAE
  default-currency: AED

app:
  admin:
    # First admin account is created on startup when both are set (see AdminBootstrap).
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    first-name: ${ADMIN_FIRST_NAME:Admin}
