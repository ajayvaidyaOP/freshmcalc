spring:
  application:
    name: freshmcalc-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/freshmcalc}
    username: ${DB_USERNAME:freshmcalc}
    password: ${DB_PASSWORD:freshmcalc}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc.batch_size: 20
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  mail:
    # Empty host = email disabled (the app still runs; reset links are logged
    # only when APP_MAIL_EXPOSE_RESET_LINK=true).
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        health: true
        info: true
  endpoint:
    health:
      # Keep the public /health probe minimal — no DB/driver details.
      show-details: never

api:
  version: v1
  base-path: /api/${api.version}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  test-mode: ${RAZORPAY_TEST_MODE:true}

jwt:
  secret: ${JWT_SECRET:change-me-in-production-this-must-be-at-least-256-bits-long}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

market:
  default-market: Dubai, UAE
  default-currency: AED

app:
  # Used to build password-reset links (no trailing slash).
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@freshmcalc.com}
    # Local development only: print reset links to the server log.
    expose-reset-link: ${APP_MAIL_EXPOSE_RESET_LINK:false}
  admin:
    # First admin account is created on startup when both are set (see AdminBootstrap).
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    first-name: ${ADMIN_FIRST_NAME:Admin}
